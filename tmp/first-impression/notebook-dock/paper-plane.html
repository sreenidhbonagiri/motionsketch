html,

body {

  padding: 0.45rem 0.9rem;
  font: inherit;
  font-size: 0.875rem;

.demo-pause:hover,
.demo-hover-tap:hover {
  background: #f8fafc;
}

.demo-replay:focus-visible,
.demo-pause:focus-visible,
.demo-hover-tap:focus-visible,
.ms-scene-5bf49ccc:focus-visible {
  outline: 2px solid #4f46e5;
  outline-offset: 2px;
}

.demo-hint {
  margin: 0;
  font-size: 0.75rem;
  color: #64748b;
  text-align: center;
  max-width: 28rem;
}

<style>
/* MotionSketch scoped scene export
 *
 * Scene isolation:
 * - Wrap markup in <div class="ms-scene-5bf49ccc"> so rules never touch host .stage/.actor.
 * - Keyframe names include a content fingerprint (5bf49ccc); project title alone is not used.
 * - For a second independently controlled copy of the same scene, re-export with
 *   instancePrefix (e.g. "hero-") or rename the root class + keyframe prefix together.
 * - This stylesheet does not reset host page styles outside .ms-scene-5bf49ccc.
 *
 * Reduced motion:
 * - Under prefers-reduced-motion: reduce, animations stay off until the scene root
 *   also has class "ms-motion-ok" (set by an explicit Play control).
 * - Automatic triggers never override reduced-motion; Play opts in.
 * - The static pose uses each actor’s base transform (clip-start / rest) and forces
 *   visibility so hide-before/hide-after cannot blank the scene.
 *
 * Playback trigger:
 * Playback trigger: page-load (CSS starts immediately; no controller required).
 *
 * Looping scenes keep running after a trigger until paused or restarted.
 * Embedding API (when JS is included): MotionSketchTrigger.init(root, options),
 *   .play() / .pause() / .resume() / .restart() / .destroy().
 *
 * Positioning:
 * - Place actors inside .ms-stage (position: relative; container-type: size).
 * - Shared Duration / loop / loopMode drive every actor’s animation together.
 * - Per-actor clips remap motion onto a start–end interval; outside that range the actor holds its first/last pose.
 * - Optional hide-before/hide-after use a separate discrete visibility animation (step timing; no fades).
 *   At an exact step-end keyframe time, Firefox still shows the previous value and
 *   jumps immediately afterward; Chromium/WebKit apply the new value at that time.
 *   Editor JS stays inclusive at start / hidden at end. Continuous playback hides
 *   the mismatch; pausing CSS/WAAPI on the exact boundary in Firefox can disagree.
 * - Coordinates are normalized stage fractions: x→cqw, y→cqh (works for non-square stages).
 * - Actor size uses cqmin (fraction of the stage's shorter axis) for the longer box edge.
 * - Motion uses transform with linear timing; visibility is orthogonal (visibility + step-*).
 * - Transform order: translate → center → rotate → scale.
 * Loop: off (plays once, forwards) — shared by every actor.
 *
 * Image actor (.ms-actor-1): CSS alone does NOT embed the image bytes.
 * Host the file yourself (or use the HTML demo export, which embeds data URLs).
 * Use an <img class="ms-actor-1"> with the same intrinsic aspect ratio as in the editor.
 *
 * Text actor (.ms-actor-2): CSS alone does NOT include the copy.
 * Put the text inside a matching element, e.g. <div class="ms-actor-2">Your text here</div>
 * Use real text (not an image). Newlines and wrapping follow white-space: pre-wrap.
 * System font stacks are self-contained; glyph shapes can vary by device.
 * HTML demo / web package exports embed the escaped copy; this CSS file does not.
 *
 * Browser support: container query units (cqw/cqh/cqmin).
 * Fallback for a fixed-size stage (replace the cq* lengths with px):
 *   Ncqw  → (N / 100) * stageWidth
 *   Ncqh  → (N / 100) * stageHeight
 *   Ncqmin → (N / 100) * min(stageWidth, stageHeight)
 *
 * Example HTML:
 * <div class="ms-scene-5bf49ccc" data-ms-scene="5bf49ccc">
 *   <div class="ms-stage">
 *     <img class="ms-actor-1" src="your-image.png" alt="Actor image" />
 *     <div class="ms-actor-2">Your text here</div>
 *   </div>
 * </div>
 */
.ms-scene-5bf49ccc .ms-stage {
  position: relative;
  container-type: size;
  width: 100%;
  aspect-ratio: 16 / 10;
  overflow: hidden;
}

.ms-scene-5bf49ccc .ms-actor-1 {
  position: absolute;
  left: 0;
  top: 0;
  width: 13.00cqmin;
  height: auto;
  aspect-ratio: 1.4000 / 1;
  object-fit: contain;
  background: transparent;
  border: none;
  padding: 0;
  transform: translate3d(10.000cqw, 74.000cqh, 0) translate(-50%, -50%) rotate(-54.228deg) scale(1);
  animation: ms-5bf49ccc-a1 2400ms linear forwards;
  will-change: transform;
  display: block;
  box-sizing: border-box;
  z-index: 1;
  /* Face along path: heading + direction offset + transform track (additive). Alternate retraces poses without turning to face reverse travel. Sampled angular export check: ≤3° over 800 probe times (not a continuous bound). */
}

  35.29% { transform: translate3d(33.564cqw, 39.096cqh, 0) translate(-50%, -50%) rotate(-28.971deg) scale(1); }
  42.86% { transform: translate3d(39.374cqw, 34.722cqh, 0) translate(-50%, -50%) rotate(-22.654deg) scale(1); }
  48.74% { transform: translate3d(44.040cqw, 32.073cqh, 0) translate(-50%, -50%) rotate(-17.699deg) scale(1); }
  54.62% { transform: translate3d(48.820cqw, 30.078cqh, 0) translate(-50%, -50%) rotate(-12.869deg) scale(1); }
  60.50% { transform: translate3d(53.699cqw, 28.715cqh, 0) translate(-50%, -50%) rotate(-8.227deg) scale(1); }
  68.07% { transform: translate3d(60.091cqw, 27.847cqh, 0) translate(-50%, -50%) rotate(-2.724deg) scale(1); }

  91.60% { transform: translate3d(80.565cqw, 30.979cqh, 0) translate(-50%, -50%) rotate(11.799deg) scale(1); }
  100% { transform: translate3d(88.000cqw, 34.000cqh, 0) translate(-50%, -50%) rotate(15.439deg) scale(1); }
}

.ms-scene-5bf49ccc .ms-actor-2 {
  position: absolute;
  left: 0;
  top: 0;
  width: 40.00cqmin;
  height: auto;
  background: transparent;
  color: #0f172a;
  font-size: 7.00cqmin;
  font-weight: 700;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  text-align: left;
  white-space: pre-wrap;
  word-break: break-word;
  line-height: 1.25;
  box-sizing: border-box;
  transform: translate3d(40.000cqw, 58.000cqh, 0) translate(-50%, -50%);
  display: block;
  box-sizing: border-box;
  z-index: 2;
}


@media (prefers-reduced-motion: reduce) {
  .ms-scene-5bf49ccc:not(.ms-motion-ok) [class^="ms-actor"] {
    animation: none !important;
    /* Keep a meaningful static pose visible (base transform); ignore clip hide flags. */
    visibility: visible !important;
  }
}

</style>

<script>
/* MotionSketch scene trigger controller
 * CSS owns keyframes; this script only activates / pauses / restarts them.
 * Offline-friendly — no network. Scope one controller per scene root.
 */
(function (global) {
  'use strict';
  var API_NAME = "MotionSketchTrigger";
  var STORE = API_NAME + '$$map';

  function map() {
    if (!global[STORE]) global[STORE] = new WeakMap();
    return global[STORE];
  }

  function actors(root, selector) {
    return Array.prototype.slice.call(root.querySelectorAll(selector));
  }

  function reducedMotion() {
    return (
      typeof global.matchMedia === 'function' &&
      global.matchMedia('(prefers-reduced-motion: reduce)').matches
    );
  }

  function isCssAnimation(anim) {
    if (!anim) return false;
    if (typeof CSSAnimation !== 'undefined' && anim instanceof CSSAnimation) {
      return true;
    }
    // jsdom / older engines: treat named CSS animations as owned.
    return typeof anim.animationName === 'string' && anim.animationName !== '' && anim.animationName !== 'none';
  }

  function restartAnimations(root, selector) {
    actors(root, selector).forEach(function (el) {
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.removeProperty('animation');
    });
  }

  function stopOwnedActorAnimations(root, selector) {
    actors(root, selector).forEach(function (el) {
      if (typeof el.getAnimations === 'function') {
        el.getAnimations().forEach(function (anim) {
          if (!isCssAnimation(anim)) return;
          try {
            anim.cancel();
          } catch (e) {}
        });
      }
      el.style.removeProperty('animation-play-state');
      el.style.removeProperty('animation');
    });
  }

  function createController(root, options) {
    var mode = options.mode || 'page-load';
    var motionOk = options.motionOkClass || 'ms-motion-ok';
    var waiting = options.waitingClass || 'ms-waiting';
    var actorSel = options.actorSelector || '[class^="ms-actor"]';
    var threshold =
      typeof options.viewportThreshold === 'number'
        ? options.viewportThreshold
        : 0.35;
    var destroyed = false;
    var started = false;
    var paused = false;
    var hoverArmed = true;
    /** True while the pointer is inside the scene root (hover mode). */
    var pointerInside = false;
    var io = null;
    var mq = null;
    var armTimer = null;
    var tapBtn = null;
    var pauseBtn = null;
    var playBtn = null;
    var onPlayClick = null;
    var onPlayPointerUp = null;
    var onPauseClick = null;
    var onTapClick = null;
    /** Dedupes pointerup + click on engines that fire both for one gesture. */
    var playActivateLock = false;
    // Track mutations the controller owns so destroy() can restore the host.
    var owned = {
      waitingAdded: false,
      waitingRemoved: false,
      motionOkAdded: false,
      tabindexAdded: false,
      roleAdded: false,
      ariaLabelAdded: false,
    };

    function setWaiting(on) {
      if (on) {
        if (!root.classList.contains(waiting)) {
          root.classList.add(waiting);
          owned.waitingAdded = true;
        }
      } else if (root.classList.contains(waiting)) {
        root.classList.remove(waiting);
        owned.waitingRemoved = true;
      }
    }

    function canAutoAnimate() {
      return !reducedMotion() || root.classList.contains(motionOk);
    }

    function clearArmTimer() {
      if (armTimer != null) {
        clearTimeout(armTimer);
        armTimer = null;
      }
    }

    function scheduleArmRefresh() {
      clearArmTimer();
      armTimer = setTimeout(function () {
        armTimer = null;
        refreshHoverArm();
      }, 0);
    }

    function syncChrome() {
      if (playBtn) {
        var needOptIn = reducedMotion() && !root.classList.contains(motionOk);
        playBtn.hidden = false;
        playBtn.textContent = needOptIn
          ? 'Play animation'
          : started
            ? 'Replay'
            : 'Play animation';
      }
      if (pauseBtn) {
        var showPause = !!options.offerPause && started && canAutoAnimate();
        pauseBtn.hidden = !showPause;
        pauseBtn.textContent = paused ? 'Resume' : 'Pause';
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
      }
      if (tapBtn) {
        tapBtn.hidden = mode !== 'hover';
      }
    }

    /**
     * @param opts.optInReducedMotion  Explicit Play / click / Enter / Space / tap.
     *   Hover and focus never set this — they must not override reduced-motion.
     */
    function beginPlayback(opts) {
      if (destroyed) return false;
      var force = opts && opts.force;
      var optIn = opts && opts.optInReducedMotion;
      if (reducedMotion() && !root.classList.contains(motionOk)) {
        if (!optIn) {
          syncChrome();
          return false;
        }
        root.classList.add(motionOk);
        owned.motionOkAdded = true;
      }
      if (!canAutoAnimate() && !force) {
        syncChrome();
        return false;
      }
      setWaiting(false);
      restartAnimations(root, actorSel);
      started = true;
      paused = false;
      actors(root, actorSel).forEach(function (el) {
        el.style.removeProperty('animation-play-state');
      });
      syncChrome();
      return true;
    }

    function pausePlayback() {
      if (destroyed || !started) return;
      paused = true;
      actors(root, actorSel).forEach(function (el) {
        el.style.animationPlayState = 'paused';
      });
      syncChrome();
    }

    function resumePlayback() {
      if (destroyed || !started) return;
      if (reducedMotion() && !root.classList.contains(motionOk)) {
        syncChrome();
        return;
      }
      paused = false;
      actors(root, actorSel).forEach(function (el) {
        el.style.removeProperty('animation-play-state');
      });
      syncChrome();
    }

    function restartPlayback() {
      beginPlayback({ force: true, optInReducedMotion: true });
    }

    function rootHasPointer() {
      try {
        return root.matches(':hover');
      } catch (e) {
        return false;
      }
    }

    function rootHasFocus() {
      var ae = document.activeElement;
      return !!(ae && root.contains(ae));
    }

    function refreshHoverArm() {
      if (!rootHasPointer() && !rootHasFocus()) {
        hoverArmed = true;
        syncChrome();
      }
    }

    function onClickActivate(event) {
      if (destroyed) return;
      if (event.target && event.target.closest && event.target.closest('[data-ms-chrome]')) {
        return;

      beginPlayback({ optInReducedMotion: true });
    }

    function onKeyActivate(event) {
      if (destroyed) return;
      if (event.target !== root) return;
      if (event.key !== 'Enter' && event.key !== ' ') return;
      event.preventDefault();
      beginPlayback({ optInReducedMotion: true });
    }

    function tryHoverFocusStart() {
      if (reducedMotion() && !root.classList.contains(motionOk)) {
        // Do not consume the arm — wait for explicit Play / tap.
        syncChrome();
        return;
      }
      if (!hoverArmed) return;
      hoverArmed = false;
      beginPlayback({ optInReducedMotion: false });
    }

    function onPointerEnter() {
      if (destroyed || mode !== 'hover') return;
      // If focus already left before this enter (blur + re-hover in one turn),
      // re-arm synchronously — do not wait for a deferred focusout timer.
      if (!pointerInside && !rootHasFocus()) {
        hoverArmed = true;
      }
      pointerInside = true;
      tryHoverFocusStart();
    }

    function onFocusIn() {
      if (destroyed || mode !== 'hover') return;
      // Focus that arrives while the pointer is already inside is the same
      // pointer session (e.g. click-to-focus), not a fresh hover/focus arm.
      if (pointerInside) return;
      tryHoverFocusStart();
    }

    function onPointerLeave() {
      if (mode !== 'hover') return;
      pointerInside = false;
      scheduleArmRefresh();
    }

    function onFocusOut(event) {
      if (mode !== 'hover') return;
      // Child→child focus stays inside the scene — never re-arm mid-transfer.
      var next = event && event.relatedTarget;
      if (next && root.contains(next)) return;
      scheduleArmRefresh();
    }

    function ensureAttr(name, value, flag) {
      if (!root.hasAttribute(name)) {
        root.setAttribute(name, value);
        owned[flag] = true;
      }
    }

    function bindChrome() {
      playBtn = root.parentElement
        ? root.parentElement.querySelector('[data-ms-play]')
        : null;
      if (!playBtn && root.ownerDocument) {
        var shell = root.closest('[data-ms-demo-shell]');
        if (shell) playBtn = shell.querySelector('[data-ms-play]');
      }
      pauseBtn = null;
      tapBtn = null;
      var shellEl = root.closest('[data-ms-demo-shell]') || root.parentElement;
      if (shellEl) {
        pauseBtn = shellEl.querySelector('[data-ms-pause]');
        tapBtn = shellEl.querySelector('[data-ms-hover-tap]');
      }

      if (playBtn) {
        function activatePlayFromControl() {
          if (playActivateLock) return;
          playActivateLock = true;
          beginPlayback({ optInReducedMotion: true });
          setTimeout(function () {
            playActivateLock = false;
          }, 0);
        }
        onPlayClick = function () {
          activatePlayFromControl();
        };
        // WebKit (Playwright): when a tabindex scene held focus, trusted
        // pointerdown/up reach Play but click is suppressed. pointerup keeps
        // reduced-motion opt-in reachable with a real pointer gesture.
        onPlayPointerUp = function (event) {
          if (typeof event.button === 'number' && event.button !== 0) return;
          activatePlayFromControl();
        };
        playBtn.addEventListener('click', onPlayClick);
        playBtn.addEventListener('pointerup', onPlayPointerUp);
      }
      if (pauseBtn) {
        onPauseClick = function () {
          if (paused) resumePlayback();
          else pausePlayback();
        };
        pauseBtn.addEventListener('click', onPauseClick);
      }
      if (tapBtn) {
        onTapClick = function () {
          hoverArmed = false;
          beginPlayback({ optInReducedMotion: true });
        };
        tapBtn.addEventListener('click', onTapClick);
      }
    }

    function bindMode() {
      // Clear leftover inline play-state from a prior instance before arming.
      actors(root, actorSel).forEach(function (el) {
        el.style.removeProperty('animation-play-state');
        el.style.removeProperty('animation');
      });

      if (mode === 'page-load') {
        if (canAutoAnimate()) {
          setWaiting(false);
          restartAnimations(root, actorSel);
          started = true;
          paused = false;
        } else {
          setWaiting(false);
          started = false;
          paused = false;
        }
        return;
      }

      setWaiting(true);
      started = false;
      paused = false;
      hoverArmed = true;
      pointerInside = false;

      if (mode === 'click') {
        ensureAttr('tabindex', '0', 'tabindexAdded');
