name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    # Wall-clock is dominated by Linux WebKit (~12–18m for the full suite on
    # one worker). Chromium/Firefox finish in ~4–6m. Shard WebKit only so two
    # runners share the suite without raising workers (WebKit still needs
    # workers=1 to stay inside the 30s test budget).
    name: E2E (${{ matrix.label }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            label: chromium
            shard_args: ''
          - project: firefox
            label: firefox
            shard_args: ''
          - project: webkit
            label: webkit 1/2
            shard_args: '--shard=1/2'
          - project: webkit
            label: webkit 2/2
            shard_args: '--shard=2/2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright ${{ matrix.project }}
        run: npx playwright install ${{ matrix.project }} --with-deps

      - name: End-to-end tests (${{ matrix.label }})
        # GitHub Actions sets CI=true, so Playwright starts its own webServer
        # (reuseExistingServer is false) and does not attach to an unrelated process.
        # WebKit jobs pass --shard so two runners cover the suite in parallel.
        run: npm run test:e2e -- --project=${{ matrix.project }} --retries=0 ${{ matrix.shard_args }}

      - name: Upload Playwright failure artifacts (${{ matrix.label }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
