name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  e2e-smoke:
    # Short cross-browser gate on every push/PR. Full suite lives in e2e-full.yml
    # (workflow_dispatch + nightly). No retries — failures stay visible.
    name: E2E smoke (${{ matrix.project }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright ${{ matrix.project }}
        run: npx playwright install ${{ matrix.project }} --with-deps

      - name: Smoke e2e (${{ matrix.project }})
        run: npm run test:e2e:smoke -- --project=${{ matrix.project }}

      - name: Upload Playwright failure artifacts (${{ matrix.project }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
